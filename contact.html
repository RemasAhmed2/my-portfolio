<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link  href="css/Style.css" rel="stylesheet">
</head>
<body>
    <header class = "nav-bar">
        <h1>My Blog</h1>
        <nav>
            <ul>
                <li> 
                    <a href="index.html">Home</a>
                </li>
                <li> 
                    <a href="about.html">About</a> 
                </li>
                <li> 
                    <a href="contact.html">Contact</a> 
                </li>
           
            </ul>
        </nav>
    </header>
    <main>
        <h2>Contact Me</h2>
        <p>Fill in the form below and I will get back to you.</p>
 <form>
            <p>Name: <input type="text" name="name"></p>
            <p>Email: <input type="email" name="email"></p>
            <p>Phone number: <input type="tel" name=" phone"></p>
            <p>Date: <input type="date" name="date"></p>

            <p>
                Contact by:
                <input type="radio" name="method" value="email"> Email
                <input type="radio" name="method" value="phone"> Phone
            </p>

            <p>
                Interests:
                <input type="checkbox" name="interest" value="html"> HTML
                <input type="checkbox" name="interest" value="css"> CSS
            </p>

            <p>
                Subject:
                <select name="subject">
                    <option>Question</option>
                    <option>Feedback</option>
                </select>
            </p>

            <p>Message:<br>
                <textarea name="message" rows="5" cols="40"></textarea>
            </p>

            <button type="submit">Send</button>
        </form>
    </main>
        
    

    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>
</body>
</html>
